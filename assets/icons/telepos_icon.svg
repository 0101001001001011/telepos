<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Telegram-style gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#37AEE2"/>
      <stop offset="100%" style="stop-color:#1E96C8"/>
    </linearGradient>
    <!-- Paper plane gradient -->
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <!-- Receipt gradient -->
    <linearGradient id="receiptGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
  </defs>

  <!-- Background - rounded square like modern app icons -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGradient)"/>

  <!-- Paper plane body - main triangle -->
  <path d="M 110 280
           L 400 130
           L 320 400
           L 260 310
           L 110 280 Z"
        fill="url(#planeGradient)"
        opacity="0.95"/>

  <!-- Paper plane shadow/fold -->
  <path d="M 260 310
           L 400 130
           L 320 400
           Z"
        fill="#C8DCE8"
        opacity="0.6"/>

  <!-- Paper plane inner fold line -->
  <path d="M 260 310
           L 400 130"
        stroke="#A0C8DC"
        stroke-width="3"
        fill="none"
        opacity="0.5"/>

  <!-- Receipt element - coming out of plane -->
  <rect x="185" y="220" width="70" height="95" rx="4" ry="4" fill="url(#receiptGradient)" opacity="0.9"/>

  <!-- Receipt lines (representing POS receipt) -->
  <line x1="195" y1="240" x2="245" y2="240" stroke="#37AEE2" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="255" x2="235" y2="255" stroke="#37AEE2" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="195" y1="268" x2="245" y2="268" stroke="#37AEE2" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="195" y1="281" x2="225" y2="281" stroke="#37AEE2" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Currency symbol on receipt (₸ for Tenge) -->
  <text x="220" y="305" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E96C8" text-anchor="middle">₸</text>

  <!-- Small highlight on plane -->
  <ellipse cx="200" cy="200" rx="30" ry="15" fill="white" opacity="0.2" transform="rotate(-35 200 200)"/>
</svg>
