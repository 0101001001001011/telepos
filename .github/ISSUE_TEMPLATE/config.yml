# Пустые issue оставлены включёнными намеренно.
#
# Мы просим у людей находки, а не заполненные формы. Наблюдение, которое не
# укладывается ни в один шаблон — «я не понял, что делать на четвёртом шаге
# мастера» — ровно то, чего набор тестов не видит и чего мы ждём больше всего.
# Форма, отказывающая такому человеку, стоит дороже, чем аккуратный трекер.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/kvgosu/telepos/blob/main/SECURITY.md
    about: >-
      Do not open a public issue. Report it privately — the process and the
      scope are described here.

  - name: Testing TelePOS — what is most useful to report
    url: https://github.com/kvgosu/telepos/blob/main/CONTRIBUTING.md
    about: >-
      The paths nobody has hammered yet, and what makes a report reproducible.
      No Dart required.

  - name: Thinking of sending a pull request?
    url: https://github.com/kvgosu/telepos/blob/main/CONTRIBUTING.md
    about: >-
      We do not accept them, and an outside pull request is closed
      automatically. Fork freely; open an issue instead. The reasoning is here.
