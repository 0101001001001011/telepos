# Bindings are generated from the crate's own header, not written by hand.
#
#   dart run ffigen --config ffigen.yaml
#
# Regenerate whenever rust/include/rk_pki.h changes, and treat any change to
# the generated file as a change of ABI: the package's major version moves
# with it.
name: RkPkiBindings
description: |
  Generated bindings for the rk_pki C ABI. Do not edit by hand.
output: 'lib/src/native/bindings.g.dart'
headers:
  entry-points:
    - 'rust/include/rk_pki.h'
  include-directives:
    - '**rk_pki.h'
functions:
  include:
    - 'rk_pki_.*'
structs:
  include:
    - 'RkPkiEngine'
comments:
  style: any
  length: full
preamble: |
  // GENERATED by ffigen from rust/include/rk_pki.h — do not edit.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names, unused_element, unused_field, lines_longer_than_80_chars, public_member_api_docs
