name: rk_infer
description: On-device inference for Dart over an embedded C++ engine, with the raw frame never leaving the worker that owns it.
version: 0.2.1
repository: https://github.com/0101001001001011/rk-infer
issue_tracker: https://github.com/0101001001001011/rk-infer/issues

environment:
  sdk: ^3.8.0
  flutter: '>=3.3.0'

dependencies:
  # Only for `Utf8` and `calloc`. Every other value crossing the boundary is a
  # pointer-sized type declared in lib/src/ffi/bindings.dart.
  ffi: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      # An FFI plugin, not a method-channel plugin: there is no platform class
      # to register, only a library to build and bundle. Without this block the
      # Flutter tool never looks at android/, linux/, windows/, ios/ or macos/,
      # and the native library reaches no application at all — И150.
      #
      # A `hook/` directory must never appear here: on Flutter stable it
      # reaches zero targets out of six, and its mere presence breaks
      # `dart run`, `dart test` and `flutter build` for every consumer.
      #
      # macOS and iOS are declared because a package without them is wrong the
      # moment a Mac appears; neither has ever been built. See README.
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
