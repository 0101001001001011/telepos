# Strict, because everything in this package is a judgement about a document
# somebody else wrote. An implicit cast or an inferred `dynamic` in that path
# is a place where "this is not a SPIFFE ID" can quietly become "this is".
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
