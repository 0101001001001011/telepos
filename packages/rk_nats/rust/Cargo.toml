[package]
name = "rk_nats"
version = "0.2.2"
edition = "2021"
rust-version = "1.82"
description = "Native NATS and JetStream client behind a C ABI, with an enforced durability contract."
license = "MIT"
repository = "https://github.com/0101001001001011/rk-nats"
publish = false

[lib]
name = "rk_nats"
# cdylib for the Dart binding, staticlib for hosts that link it in, rlib so the
# crate's own tests can reach past the C ABI. Per-platform build wiring is a
# separate decision and deliberately absent here.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-nats = "0.50"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[profile.release]
# A returned failure is worthless if the process aborts first: unwinding must
# reach the catch_unwind at the C ABI boundary (I144).
panic = "unwind"
