[package]
name = "rk_syslog"
version = "0.2.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "RFC 5424 framing, RFC 5425 delivery over TLS and a bounded on-disk spool, behind a C ABI."
repository = "https://github.com/0101001001001011/rk-syslog"
publish = false

[lib]
name = "rk_syslog"
# Both kinds on purpose. The per-platform Flutter build wiring is decided
# elsewhere, once, for every rk_* package; whichever it picks, one of these two
# is what it will ask for. Nothing here depends on that choice.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# ring rather than aws-lc-rs: aws-lc-sys wants cmake and nasm on Windows, which
# would put a toolchain requirement on the later build wiring for no gain here.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
rustls-pemfile = "2"
sha2 = "0.10"

[dev-dependencies]
# Test-only. Generates the throwaway certificate the end-to-end TLS test needs;
# never part of the published artefact.
rcgen = "0.14"

[profile.release]
# panic = "abort" is deliberately NOT set, and must not be set by whoever wires
# the build. И144 requires a failure to come back as a value; catch_unwind at
# the boundary is what makes that true, and abort makes catch_unwind a lie.
panic = "unwind"
opt-level = "s"
lto = true
