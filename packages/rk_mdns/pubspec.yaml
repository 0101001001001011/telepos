name: rk_mdns
description: An mDNS responder and DNS-SD browser for Dart over a native library, so an application can be found on a local network without a system daemon.
version: 0.1.0
repository: https://github.com/0101001001001011/rk-mdns
issue_tracker: https://github.com/0101001001001011/rk-mdns/issues

environment:
  sdk: ^3.8.0
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The same rule set the sibling rk_* packages analyse against, so that one CI
  # job can hold them all to one standard. See analysis_options.yaml.
  lints: ^5.0.0

flutter:
  plugin:
    platforms:
      # An FFI plugin, not a method-channel plugin: there is no platform class
      # to register, only a library to build and bundle. The mechanism is
      # architecture, not taste — docs/system-architecture.md, И150. A `hook/`
      # directory must never appear here: on Flutter stable it reaches zero
      # targets out of six, and its mere presence breaks `dart run`,
      # `dart test` and `flutter build` for every consumer.
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
